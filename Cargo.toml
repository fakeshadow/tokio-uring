[package]
name = "tokio-uring"
version = "0.5.1"
authors = ["Tokio Contributors <team@tokio.rs>"]
edition = "2024"
readme = "README.md"
license = "MIT"
documentation = "https://docs.rs/tokio-uring/0.5.0/tokio-uring"
repository = "https://github.com/tokio-rs/tokio-uring"
homepage = "https://tokio.rs"
description = """
io-uring support for the Tokio asynchronous runtime.
"""
categories = ["asynchronous", "network-programming"]
keywords = ["async", "fs", "io-uring"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
bytes = ["dep:bytes"]

[dependencies]
tokio = { version = "1.48", features = ["net", "rt", "sync"] }
slab = "0.4.11"
libc = "0.2.178"
io-uring = "0.7.11"
socket2 = { version = "0.6.1", features = ["all"] }
bytes = { version = "1.11.0", optional = true }

[dev-dependencies]
tempfile = "3.2.0"
tokio-test = "0.4.2"
iai = "0.1.1"
criterion = "0.8.0"
# we use joinset in our tests
tokio = "1.21.2"
nix = "0.26"

[package.metadata.docs.rs]
all-features = true

[profile.bench]
debug = true

[[bench]]
name = "lai_no_op"
path = "benches/lai/no_op.rs"
harness = false

[[bench]]
name = "criterion_no_op"
path = "benches/criterion/no_op.rs"
harness = false
